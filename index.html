<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MisoEQ</title>
<meta name="description" content="A system-wide audio filter for people with misophonia. macOS beta.">
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="/img/favicon-64.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<!-- Link previews on Discord, Facebook, X, iMessage -->
<meta property="og:title" content="MisoEQ">
<meta property="og:description" content="A system-wide audio filter for people with misophonia. macOS beta.">
<meta property="og:image" content="https://misofilter.github.io/img/share-preview.png">
<meta property="og:url" content="https://misofilter.github.io/">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#A3C7D6">
<style>
  /* MisoEQ brand: Fender Sonic Blue body, white pickguard, black hardware. */
  :root {
    color-scheme: light;
    --sonic: #A3C7D6;
    --sonic-light: #B0D1DE;
    --sonic-deep: #6B9EB5;
    --ink: #000;
    --ink-soft: rgba(0, 0, 0, .68);
    --guard: #F7F7F7;
    --lcd: #34C759;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 32px 16px;
    background: linear-gradient(180deg, var(--sonic-light), var(--sonic) 50%, #99BFD1);
    color: var(--ink);
    font: 17px/1.5 ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  }
  main {
    width: 100%;
    max-width: 620px;
    background: var(--guard);
    border: 3px solid var(--ink);
    border-radius: 28px;
    padding: 40px 36px 34px;
    box-shadow: 0 18px 40px rgba(0, 0, 0, .18);
    text-align: center;
  }
  .icon { width: 128px; height: 128px; display: block; margin: 0 auto 12px; }
  h1 { margin: 0; font-size: 64px; line-height: 1; font-weight: 900; letter-spacing: -1px; }
  .label {
    margin: 12px 0 0;
    font-size: 13px; font-weight: 700; letter-spacing: .28em;
    color: var(--ink-soft);
  }
  .tagline { margin: 18px 0 0; font-size: 19px; color: var(--ink-soft); }
  .lcd {
    display: inline-block;
    margin-top: 18px;
    padding: 5px 12px;
    background: var(--ink);
    color: var(--lcd);
    border-radius: 6px;
    font: 700 14px/1.4 ui-monospace, "SF Mono", Menlo, monospace;
    letter-spacing: .04em;
  }
  .links { margin-top: 28px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .button {
    display: inline-block;
    padding: 12px 22px;
    border-radius: 12px;
    border: 2px solid var(--ink);
    font-weight: 700;
    text-decoration: none;
    color: var(--ink);
    background: #fff;
  }
  .button.primary { background: var(--ink); color: #fff; }
  .button:hover { transform: translateY(-1px); }
  .button:focus-visible { outline: 3px solid var(--sonic-deep); outline-offset: 3px; }
  footer { margin-top: 26px; font-size: 13px; color: var(--ink-soft); }
  @media (max-width: 480px) {
    main { padding: 30px 20px 26px; border-radius: 22px; }
    .icon { width: 104px; height: 104px; }
    h1 { font-size: 48px; }
    .label { font-size: 11px; letter-spacing: .2em; }
    .tagline { font-size: 17px; }
  }
</style>
</head>
<body>
<main>
  <img class="icon" src="/img/icon-512.png" alt="MisoEQ app icon: a fader panel">
  <h1>MisoEQ</h1>
  <p class="label">TRIGGER SOUND FILTER + EQ</p>
  <p class="tagline">A system-wide audio filter for people with misophonia.</p>
  <span class="lcd">macOS BETA · OPENS SOON</span>
  <div class="links">
    <a class="button primary" href="/discord/">Join the Discord</a>
    <a class="button" href="/tutorials/">Watch tutorials</a>
  </div>
  <footer>Help, bug reports and beta news are on the Discord.</footer>
</main>
</body>
</html>
